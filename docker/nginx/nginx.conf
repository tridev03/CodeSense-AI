# ────────────────────────────────────────────────────────────────────────────
# Nginx Hardened Reverse Proxy Configuration (DEP-13)
# - Enforces TLS
# - Adds security headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options)
# - Restricts request body size
# - Proxies /metrics with authentication or internal access only
# ────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with correlation and latency
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_request_id" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Max body size (limits file upload / payload injection, DEP-13, SEC-08)
    client_max_body_size 50M;

    upstream api_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Security Headers (DEP-13)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Health probes (allowed for orchestrator) ──────────────────────────
        location /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Protected Prometheus metrics endpoint ─────────────────────────────
        location /metrics {
            # Allow only internal subnets or monitoring scrapers
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 127.0.0.1;
            # deny all;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # ── Main API routes ───────────────────────────────────────────────────
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
