# ────────────────────────────────────────────────────────────────────────────
# Prometheus Alerting Rules (OBS-08)
# Defines actionable alert thresholds for API latency, error rates, and outages.
# ────────────────────────────────────────────────────────────────────────────

groups:
  - name: ai_knowledge_agent_alerts
    rules:
      # ── High Error Rate ───────────────────────────────────────────────────
      - alert: HighHttpErrorRate
        expr: rate(http_requests_failed_total[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate (> 5%) detected"
          description: "Over 5% of API requests returned HTTP 5xx over the last 5 minutes."
          runbook_url: "docs/runbooks/operations.md#high-error-rate"

      # ── Latency Spike (p95 > 2.5s) ─────────────────────────────────────────
      - alert: HighRequestLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "p95 API response time is above 2.5 seconds"
          description: "Elevated latency detected on API endpoints."
          runbook_url: "docs/runbooks/operations.md#latency-spikes"

      # ── RAG Stage Latency Degraded ─────────────────────────────────────────
      - alert: HighVectorSearchLatency
        expr: histogram_quantile(0.95, sum(rate(rag_stage_duration_seconds_bucket{stage="vector_search"}[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Qdrant vector search p95 latency exceeds 1s"
          description: "Vector database queries are taking longer than normal."
          runbook_url: "docs/runbooks/operations.md#vector-store-degraded"

      # ── Ingestion Service Down ─────────────────────────────────────────────
      - alert: BackendUnhealthy
        expr: probe_success{instance="http://backend:8000/health/liveness"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI backend container is unresponsive"
          description: "Liveness probe failed for more than 1 minute."
          runbook_url: "docs/runbooks/operations.md#service-recovery"
