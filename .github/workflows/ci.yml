name: CI & Backend Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key-that-is-at-least-32-chars-long
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          QDRANT_URL: http://localhost:6333
          HF_HUB_DISABLE_SYMLINKS_WARNING: 1
          GIT_PYTHON_REFRESH: quiet
        run: |
          python -m pytest backend/tests/ -v --tb=short

  frontend:
    name: Frontend Quality Gates (TypeCheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Next.js production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  docker-build:
    name: Docker Production Image Build (DEP-02)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: ai-knowledge-backend:ci-test
